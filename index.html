<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Happy Belated Birthday, Agnes</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Quicksand:wght@300;400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Quicksand',sans-serif;background:linear-gradient(165deg,#fdf6f0 0%,#f8e6e0 45%,#f5ddd4 100%);color:#4a342c;min-height:100vh;overflow-x:hidden;font-size:16px;line-height:1.55}
.container{max-width:430px;margin:0 auto;padding:14px 16px 90px;min-height:100vh}
.page{display:none;opacity:0;transform:translateY(12px);transition:opacity .45s ease,transform .45s ease}
.page.active{display:block;opacity:1;transform:translateY(0)}
.illustration{width:100%;border-radius:18px;box-shadow:0 8px 28px rgba(180,110,100,.16);margin-bottom:16px;object-fit:cover;max-height:380px}
h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:2.05rem;text-align:center;color:#c47a6e;margin-bottom:4px;line-height:1.2}
.subtitle{text-align:center;font-size:.92rem;color:#8a6a62;margin-bottom:14px}
.message{font-family:'Cormorant Garamond',serif;font-size:1.22rem;line-height:1.65;text-align:center;color:#4a342c;margin:12px 0 14px}
.pinyin{font-size:.82rem;color:#9a7a72;font-style:italic;display:block;margin-top:4px;letter-spacing:.3px}
.mandarin{font-size:1.12rem;color:#c47a6e;display:block;margin-top:6px}
.btn{display:block;width:100%;padding:14px 16px;background:linear-gradient(135deg,#f0c4b8,#e8a898);color:#fff;border:none;border-radius:50px;font-family:'Quicksand',sans-serif;font-size:1rem;font-weight:500;cursor:pointer;box-shadow:0 4px 14px rgba(196,130,110,.28);margin-top:8px;transition:transform .15s ease}
.btn:active{transform:scale(.98)}
.nav{display:flex;gap:10px;margin-top:18px}
.nav button{flex:1;padding:12px;background:transparent;border:1.5px solid #e0b8b0;color:#c47a6e;border-radius:50px;font-family:'Quicksand',sans-serif;font-size:.95rem;cursor:pointer}
.dots{display:flex;justify-content:center;gap:7px;margin:16px 0 8px}
.dot{width:7px;height:7px;border-radius:50%;background:#e8c4b8;transition:.25s}
.dot.active{background:#c47a6e;transform:scale(1.3)}
.notice{text-align:center;font-size:.78rem;color:#8a6a62;margin-top:20px;line-height:1.45}
.quote{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.12rem;color:#5a4038;text-align:center;margin:10px 0;line-height:1.55}
.verse{background:rgba(255,255,255,.55);border-radius:14px;padding:14px 12px;margin:12px 0}
.voucher-box{background:#fff;border-radius:16px;padding:16px 14px;margin:10px 0 14px;box-shadow:0 4px 16px rgba(196,130,110,.12)}
.voucher-code{font-size:1.35rem;letter-spacing:1.5px;text-align:center;color:#c47a6e;font-weight:600;margin:8px 0;font-family:ui-monospace,monospace}
.steps{font-size:.88rem;line-height:1.5;color:#4a342c;padding-left:18px}
.steps li{margin-bottom:6px}
.music-btn{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;background:#fff;border:1.5px solid #e0b8b0;color:#c47a6e;border-radius:50px;padding:10px 18px;font-size:.82rem;box-shadow:0 4px 12px rgba(0,0,0,.08);cursor:pointer;font-family:'Quicksand',sans-serif}
.petal{position:fixed;border-radius:50%;background:#f8c8d0;pointer-events:none;z-index:1;animation:fall linear infinite;will-change:transform,opacity}
@keyframes fall{0%{transform:translateY(-12vh) rotate(0deg) scale(1);opacity:.55}40%{opacity:.4}100%{transform:translateY(110vh) rotate(380deg) scale(.75);opacity:0}}
.orig-frame{text-align:center;margin:14px 0}
.orig-frame img{width:100%;max-width:300px;border-radius:16px;box-shadow:0 6px 20px rgba(180,110,100,.2);border:5px solid #fff}
.copy-feedback{text-align:center;color:#c47a6e;font-size:.85rem;min-height:1.2em;margin-top:6px}
</style>
</head>
<body>
<button class="music-btn" id="musicBtn">Play Soft Music</button>
<audio id="bgm" loop preload="none"><source src="https://cdn.pixabay.com/audio/2024/11/11/00-00-50-722.mp3" type="audio/mpeg"></audio>
<div class="container" id="app"></div>
<script>
const musicBtn=document.getElementById('musicBtn');
const bgm=document.getElementById('bgm');
let musicPlaying=false, current=0, total=7;

musicBtn.onclick=()=>{
  if(musicPlaying){bgm.pause();musicPlaying=false;musicBtn.textContent='Play Soft Music';}
  else{bgm.play().catch(()=>{});musicPlaying=true;musicBtn.textContent='Pause Music';}
};

function createPetals(){
  for(let i=0;i<18;i++){
    const p=document.createElement('div');
    p.className='petal';
    const s=4+Math.random()*6;
    p.style.width=s+'px'; p.style.height=s+'px';
    p.style.left=Math.random()*100+'%';
    p.style.animationDuration=(8+Math.random()*7)+'s';
    p.style.animationDelay=Math.random()*5+'s';
    p.style.opacity=(.28+Math.random()*.35).toFixed(2);
    if(Math.random()>0.6) p.style.background='#f0d4dc';
    document.body.appendChild(p);
  }
}

function goTo(n){
  if(n<0||n>=total||n===current) return;
  const c=document.getElementById('page'+current);
  const x=document.getElementById('page'+n);
  if(!c||!x) return;
  c.style.opacity='0';
  c.style.transform='translateY(-8px)';
  setTimeout(()=>{
    c.classList.remove('active');
    x.classList.add('active');
    x.style.opacity='0';
    x.style.transform='translateY(12px)';
    requestAnimationFrame(()=>{
      x.style.opacity='1';
      x.style.transform='translateY(0)';
    });
    current=n;
    document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===current));
    window.scrollTo({top:0, behavior:'instant'});
  }, 220);
}
window.nextPage=()=>goTo(current+1);
window.prevPage=()=>goTo(current-1);
window.readAgain=()=>goTo(0);

window.copyCode=function(){
  navigator.clipboard.writeText('B5RCQTDVTC').then(()=>{
    const fb=document.getElementById('copyFb');
    if(fb){fb.textContent='Kode tersalin'; setTimeout(()=>fb.textContent='',1800);}
  }).catch(()=>{
    const fb=document.getElementById('copyFb');
    if(fb) fb.textContent='Gagal menyalin, silakan salin manual';
  });
};

  <p class="message">I’m grateful for you, and I pray this new year of your life brings you peace, joy, and little moments worth keeping.</p>
  <div class="verse">
    <p class="quote">“For I know the plans I have for you,” declares the Lord, “plans to prosper you and not to harm you, plans to give you hope and a future.”</p>
    <p style="text-align:center;font-size:.8rem;color:#8a6a62;margin-top:6px">Jeremiah 29:11 (NIV)</p>
